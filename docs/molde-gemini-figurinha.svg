    não copia letras.
  -->
  <rect width="600" height="750" fill="#e6e6e6" />
  <g fill="#8c8c8c">
    <ellipse cx="300" cy="278" rx="92" ry="126" />
    <path d="M 258 380 L 252 470 Q 120 482 40 530 Q 8 550 0 580 L 0 750 L 600 750 L 600 580 Q 592 550 560 530 Q 480 482 348 470 L 342 380 Z" />
  </g>
</svg>
