<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1280" viewBox="0 0 600 750">
  <!--
    Referência de enquadramento para gerar a foto da figurinha no Gemini (exportada em PNG ao lado), em pé 4:5.
